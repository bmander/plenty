# Recompute the results, run the tests, render the site and publish it to GitHub Pages:
# on every push to main, and by hand. Pages must be set to deploy from GitHub Actions
# (Settings > Pages > Source).
name: site
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Recompute results from config and data
        run: python scripts/03_run.py > /dev/null
      - run: python -m pytest tests
      - name: Render the site
        run: python -m plenty.site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
