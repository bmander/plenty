name  = "Who owes whom what"
by    = "Claude, as a first example"
what  = "A formal system that takes the records of what happened and the rules that apply (prices, contracts, tax law, benefit rules, billing codes) and works out what each party owes, with the document that says so."
check = "Its answers are compared with settled cases: audited accounts, adjudicated claims and assessed returns."

[cost]
hours = 1e7
basis = "A guess at the order of magnitude: five thousand person-years, the size of a large body of rules written out formally."

